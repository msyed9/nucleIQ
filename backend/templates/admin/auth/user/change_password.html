{% extends "admin/change_form.html" %}
{% load i18n static %}

{% block field_sets %}
<div class="password-change-form">
    <p>{% trans "Enter a new password for the user" %} <strong>{{ original }}</strong>.</p>

    {% for fieldset in adminForm %}
    {% include "admin/includes/fieldset.html" %}
    {% endfor %}
</div>

<style>
    .password-change-form {
        background: #f9fafb;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .password-change-form p {
        margin-bottom: 15px;
        font-size: 14px;
        color: #333;
    }

    .password-change-form strong {
        color: #667eea;
        font-weight: 600;
    }
</style>
{% endblock %}
