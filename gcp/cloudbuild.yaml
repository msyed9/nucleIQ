steps:
  # ── Build backend image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - --target=production
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/backend:$SHORT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/backend:latest'
      - -f
      - backend/Dockerfile
      - ./backend

  # ── Build frontend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - --target=production
      - --build-arg
      - VITE_API_URL=$_API_URL
      - --build-arg
      - VITE_WS_URL=$_WS_URL
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/frontend:$SHORT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/frontend:latest'
      - -f
      - frontend/Dockerfile
      - ./frontend

  # ── Push images ───────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    args: [push, '--all-tags', '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/backend']
    waitFor: [build-backend]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    args: [push, '--all-tags', '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/frontend']
    waitFor: [build-frontend]

  # ── Deploy backend to Cloud Run ───────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nucleiq-backend
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/backend:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --service-account=nucleiq-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:nucleiq-db
      - --memory=1Gi
      - --cpu=1
      - --concurrency=80
      - --min-instances=0
      - --max-instances=5
      - --timeout=300
      - --set-env-vars=DJANGO_SETTINGS_MODULE=config.settings.cloudrun
      - --update-secrets=SECRET_KEY=nucleiq-secret-key:latest,DATABASE_URL=nucleiq-database-url:latest,SCHEDULER_SECRET=nucleiq-scheduler-secret:latest
    waitFor: [push-backend]

  # ── Deploy frontend to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nucleiq-frontend
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/frontend:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --memory=256Mi
      - --cpu=1
      - --concurrency=200
      - --min-instances=0
      - --max-instances=3
      - --allow-unauthenticated
    waitFor: [push-frontend]

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/backend:$SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/nucleiq/frontend:$SHORT_SHA'

substitutions:
  _REGION: asia-south1                      # Mumbai — closest to India
  _API_URL: https://REPLACE_WITH_BACKEND_URL/api
  _WS_URL: wss://REPLACE_WITH_BACKEND_URL/ws

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8                 # Faster builds (dlib compilation is slow)
