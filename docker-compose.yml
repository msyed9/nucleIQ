version: '3.9'

services:
  # PostgreSQL Database with RLS support
  db:
    image: postgres:16-alpine
    container_name: nucleiq_db
    environment:
      POSTGRES_DB: nucleiq
      POSTGRES_USER: nucleiq_user
      POSTGRES_PASSWORD: nucleiq_pass_dev_only
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_rls.sql:/docker-entrypoint-initdb.d/01_init_rls.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nucleiq_user -d nucleiq" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nucleiq_network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: nucleiq_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nucleiq_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nucleiq_backend
    # Use entrypoint for automated startup (migrations, RLS, server)
    # For development, override with: docker-compose run --rm backend python manage.py runserver 0.0.0.0:8000
    command: [ "bash", "/app/backend/docker-entrypoint.sh" ]
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://nucleiq_user:nucleiq_pass_dev_only@db:5432/nucleiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nucleiq_network
    stdin_open: true
    tty: true

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nucleiq_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - nucleiq_network
    stdin_open: true
    tty: true

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nucleiq_celery
    command: celery -A config worker -l info --pool=solo
    volumes:
      - ./backend:/app/backend
      - media_volume:/app/backend/media
    env_file:
      - ./backend/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://nucleiq_user:nucleiq_pass_dev_only@db:5432/nucleiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nucleiq_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nucleiq_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://nucleiq_user:nucleiq_pass_dev_only@db:5432/nucleiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nucleiq_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: nucleiq_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nucleiq_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  pgadmin_data:


networks:
  nucleiq_network:
    driver: bridge
