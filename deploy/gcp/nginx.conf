# Nginx configuration for Cloud Run
# Listens on port 8080 (Cloud Run requirement)

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name _;
    
    client_max_body_size 100M;
    
    # Health check endpoint - responds immediately without Django
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Static files
    location /static/ {
        alias /app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias /app/backend/media/;
        expires 7d;
    }
    
    # API requests to Django
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
    
    # Django admin (obscured URL)
    location /nq-admin-panel/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
    }


    
    # Frontend SPA - serve index.html for all other routes
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # NEVER cache index.html to ensure users always get the latest React app version
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # Cache Vite hashed assets aggressively
    location /assets/ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
