# GitHub Actions workflow to deploy nucleIQ to Azure Container Apps
name: Deploy to Azure

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  # Azure Container Registry
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  
  # Image names
  BACKEND_IMAGE: nucleiq-backend
  FRONTEND_IMAGE: nucleiq-frontend
  
  # Azure settings
  RESOURCE_GROUP: nucleiq-rg
  LOCATION: eastus

jobs:
  # ============================================
  # Build and Push Docker Images to ACR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        run: |
          # Generate unique tag using commit SHA and timestamp
          VERSION="${{ github.sha }}-$(date +%Y%m%d%H%M%S)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Image version: ${VERSION}"

      # Build and push Backend image
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend image
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to Azure Container Apps
  # ============================================
  deploy:
    name: Deploy to Azure
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.frontend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Run database migrations
      - name: Run Database Migrations
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp exec \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --command "python manage.py migrate --no-input" \
              2>/dev/null || echo "Container may not exist yet, will create in next step"

      # Deploy Backend Container App
      - name: Deploy Backend
        id: deploy-backend
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Check if container app exists
            EXISTS=$(az containerapp show \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query name \
              -o tsv 2>/dev/null || echo "")
            
            if [ -z "$EXISTS" ]; then
              echo "Creating new container app..."
              az containerapp create \
                --name nucleiq-backend \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment nucleiq-env \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
                --registry-server ${{ env.ACR_LOGIN_SERVER }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }} \
                --target-port 8000 \
                --ingress external \
                --min-replicas 1 \
                --max-replicas 3 \
                --cpu 0.5 \
                --memory 1Gi \
                --env-vars \
                  "DJANGO_SETTINGS_MODULE=config.settings.production" \
                  "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
                  "REDIS_URL=${{ secrets.REDIS_URL }}" \
                  "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
                  "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" \
                  "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" \
                  "AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
                  "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}"
            else
              echo "Updating existing container app..."
              az containerapp update \
                --name nucleiq-backend \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
            fi
            
            # Get backend URL
            BACKEND_URL=$(az containerapp show \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "backend_url=https://${BACKEND_URL}" >> $GITHUB_OUTPUT

      # Deploy Celery Worker
      - name: Deploy Celery Worker
        uses: azure/CLI@v1
        with:
          inlineScript: |
            EXISTS=$(az containerapp show \
              --name nucleiq-celery \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query name \
              -o tsv 2>/dev/null || echo "")
            
            if [ -z "$EXISTS" ]; then
              az containerapp create \
                --name nucleiq-celery \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment nucleiq-env \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
                --registry-server ${{ env.ACR_LOGIN_SERVER }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }} \
                --min-replicas 1 \
                --max-replicas 2 \
                --cpu 0.5 \
                --memory 1Gi \
                --command "celery" "-A" "config" "worker" "-l" "info" "--concurrency=2" \
                --env-vars \
                  "DJANGO_SETTINGS_MODULE=config.settings.production" \
                  "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
                  "REDIS_URL=${{ secrets.REDIS_URL }}" \
                  "CELERY_BROKER_URL=${{ secrets.REDIS_URL }}" \
                  "SECRET_KEY=${{ secrets.SECRET_KEY }}"
            else
              az containerapp update \
                --name nucleiq-celery \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
            fi

      # Deploy Frontend Container App
      - name: Deploy Frontend
        id: deploy
        uses: azure/CLI@v1
        with:
          inlineScript: |
            EXISTS=$(az containerapp show \
              --name nucleiq-frontend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query name \
              -o tsv 2>/dev/null || echo "")
            
            if [ -z "$EXISTS" ]; then
              az containerapp create \
                --name nucleiq-frontend \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment nucleiq-env \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
                --registry-server ${{ env.ACR_LOGIN_SERVER }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }} \
                --target-port 80 \
                --ingress external \
                --min-replicas 1 \
                --max-replicas 3 \
                --cpu 0.25 \
                --memory 0.5Gi
            else
              az containerapp update \
                --name nucleiq-frontend \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
            fi
            
            # Get frontend URL
            FRONTEND_URL=$(az containerapp show \
              --name nucleiq-frontend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "frontend_url=https://${FRONTEND_URL}" >> $GITHUB_OUTPUT

      # Run post-deployment tasks
      - name: Run Post-Deployment Tasks
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Run migrations
            az containerapp exec \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --command "python manage.py migrate --no-input"
            
            # Collect static files
            az containerapp exec \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --command "python manage.py collectstatic --no-input"

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment Complete!"
          echo "================================"
          echo "Frontend URL: ${{ steps.deploy.outputs.frontend_url }}"
          echo "Backend URL: ${{ steps.deploy-backend.outputs.backend_url }}"
          echo "Image Tag: ${{ needs.build-and-push.outputs.image_tag }}"
