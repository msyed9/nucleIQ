# NucleiQ Production Deployment Pipeline
# Deploys to Azure Container Apps on push to main/production branch

name: Deploy to Production

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        default: true
        type: boolean
      deploy_workers:
        description: 'Deploy Celery Workers'
        required: true
        default: true
        type: boolean

env:
  AZURE_CONTAINER_REGISTRY: nucleiqacr
  REGISTRY_URL: nucleiqacr.azurecr.io
  CONTAINER_APP_ENVIRONMENT: nucleiq-production
  RESOURCE_GROUP: nucleiq-production-rg
  LOCATION: centralindia

jobs:
  # ============================================
  # BUILD PHASE
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_backend == 'true' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/nucleiq-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/nucleiq-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://api.nucleiq.io/api
            VITE_WS_URL=wss://api.nucleiq.io/ws

  # ============================================
  # DEPLOY PHASE
  # ============================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-backend
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_backend == 'true' }}
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend Container App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-backend:${{ github.sha }}

      - name: Run Database Migrations
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp exec \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --command "python manage.py migrate --noinput" \
              --container nucleiq-backend

      - name: Collect Static Files
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp exec \
              --name nucleiq-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --command "python manage.py collectstatic --noinput" \
              --container nucleiq-backend

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true' }}
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Frontend Container App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name nucleiq-frontend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-frontend:${{ github.sha }}

  deploy-workers:
    name: Deploy Celery Workers
    runs-on: ubuntu-latest
    needs: build-backend
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_workers == 'true' }}
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Celery Worker
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name nucleiq-celery-worker \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-backend:${{ github.sha }}

      - name: Deploy Celery Beat
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name nucleiq-celery-beat \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-backend:${{ github.sha }}

  # ============================================
  # POST-DEPLOY VERIFICATION
  # ============================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    
    steps:
      - name: Health Check - Frontend
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://nucleiq.io/ || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Frontend is healthy"
              break
            fi
            echo "Attempt $i: Frontend returned $response, retrying..."
            sleep 10
          done

      - name: Health Check - Backend API
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://api.nucleiq.io/api/health/ || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Backend API is healthy"
              break
            fi
            echo "Attempt $i: Backend returned $response, retrying..."
            sleep 10
          done

  # ============================================
  # NOTIFICATIONS
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-workers, verify-deployment]
    if: always()
    
    steps:
      - name: Deployment Success Notification
        if: ${{ needs.verify-deployment.result == 'success' }}
        run: |
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo "Frontend: https://nucleiq.io"
          echo "Backend API: https://api.nucleiq.io"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: Deployment Failure Notification
        if: ${{ needs.verify-deployment.result == 'failure' }}
        run: |
          echo "❌ DEPLOYMENT FAILED"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Please check the workflow logs for details."
          exit 1
