# NucleIQ CI/CD Pipeline
# Automatically deploys to Oracle Cloud when pushing to main/master branch

name: Deploy to Oracle Cloud

on:
  push:
    branches: 
      - main
      - master
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # JOB 1: Build and Test
  # ============================================
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run backend checks
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
          ALLOWED_HOSTS: '*'
        run: |
          python manage.py check
          echo "✅ Backend checks passed"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔧 Create production .env
        working-directory: frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: 🏗️ Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ============================================
  # JOB 2: Deploy to Oracle Cloud
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 🚀 Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            cd /home/deploy/apps/nucleIQ/repo
            
            # Pull latest changes
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            
            echo "📦 Updating backend..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            echo "🏗️ Building frontend..."
            cd ../frontend
            echo "VITE_API_URL=/api" > .env
            npm ci
            export NODE_OPTIONS=--max-old-space-size=4096
            npm run build
            
            echo "🔄 Restarting services..."
            sudo chown -R deploy:www-data /home/deploy/apps/nucleIQ/repo/frontend/dist
            sudo systemctl restart gunicorn
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"

      - name: 🏥 Health Check
        run: |
          sleep 10
          curl -f http://${{ secrets.ORACLE_HOST }}/ || exit 1
          echo "✅ Application is accessible!"

# ============================================
# SETUP INSTRUCTIONS
# ============================================
# 
# Add these secrets in GitHub Repository Settings > Secrets and variables > Actions:
#
# 1. ORACLE_HOST: Your Oracle Cloud server public IP (e.g., 140.245.217.236)
# 2. ORACLE_USER: SSH username (e.g., ubuntu)
# 3. ORACLE_SSH_KEY: Your private SSH key (the content of your .pem file)
# 4. ORACLE_PORT: SSH port (usually 22)
#
# To get your SSH key content:
# - Open your .pem file in a text editor
# - Copy the entire content including:
#   -----BEGIN RSA PRIVATE KEY-----
#   ... (key content) ...
#   -----END RSA PRIVATE KEY-----
# - Paste as the secret value
#
# Server Prerequisites:
# - Git repository already cloned at /home/deploy/apps/nucleIQ/repo
# - Python virtual environment at /home/deploy/apps/nucleIQ/repo/backend/venv
# - Node.js and npm installed
# - Gunicorn and Nginx configured and running
# - deploy user has sudo access without password for systemctl commands
