# NucleIQ Staging Deployment Pipeline
# Deploys to staging environment on push to develop branch

name: Deploy to Staging

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - main
      - production

env:
  AZURE_CONTAINER_REGISTRY: nucleiqacr
  REGISTRY_URL: nucleiqacr.azurecr.io
  CONTAINER_APP_ENVIRONMENT: nucleiq-staging
  RESOURCE_GROUP: nucleiq-staging-rg
  LOCATION: centralindia

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements/dev.txt

      - name: Run backend tests
        run: |
          cd backend
          python manage.py test --settings=config.settings.dev --verbosity=2
        env:
          DATABASE_URL: sqlite:///db.sqlite3
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'

      # Frontend Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend type check
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api-staging.nucleiq.io/api

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build --target production \
            -t ${{ env.REGISTRY_URL }}/nucleiq-backend:staging-${{ github.sha }} \
            ./backend
          docker push ${{ env.REGISTRY_URL }}/nucleiq-backend:staging-${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build --target production \
            --build-arg VITE_API_URL=https://api-staging.nucleiq.io/api \
            -t ${{ env.REGISTRY_URL }}/nucleiq-frontend:staging-${{ github.sha }} \
            ./frontend
          docker push ${{ env.REGISTRY_URL }}/nucleiq-frontend:staging-${{ github.sha }}

      - name: Deploy to Staging Environment
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Deploy backend
            az containerapp update \
              --name nucleiq-backend-staging \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-backend:staging-${{ github.sha }} \
              2>/dev/null || echo "Backend staging container not found, skipping..."
            
            # Deploy frontend
            az containerapp update \
              --name nucleiq-frontend-staging \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_URL }}/nucleiq-frontend:staging-${{ github.sha }} \
              2>/dev/null || echo "Frontend staging container not found, skipping..."

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Staging Deployment Ready**\n\n- Frontend: https://staging.nucleiq.io\n- API: https://api-staging.nucleiq.io\n\nCommit: `${{ github.sha }}`'
            })
