# Security Scanning Workflow
# Runs on every push and PR

name: Security Scan

on:
  push:
    branches: [main, production, develop]
  pull_request:
    branches: [main, production]
  schedule:
    # Run weekly on Sundays
    - cron: '0 0 * * 0'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python dependency scan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety
        run: pip install safety

      - name: Scan Python dependencies
        run: |
          safety check -r backend/requirements/prod.txt --output json > python-vulnerabilities.json || true
          cat python-vulnerabilities.json

      # Node.js dependency scan
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Node.js dependencies
        run: |
          cd frontend
          npm audit --json > ../node-vulnerabilities.json || true
          cat ../node-vulnerabilities.json

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: |
            python-vulnerabilities.json
            node-vulnerabilities.json

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: |
          docker build --target production -t nucleiq-backend:scan ./backend

      - name: Run Trivy vulnerability scanner - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nucleiq-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Build frontend image for scanning
        run: |
          docker build --target production -t nucleiq-frontend:scan ./frontend

      - name: Run Trivy vulnerability scanner - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nucleiq-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
