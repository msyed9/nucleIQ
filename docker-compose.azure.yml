# Azure Production Docker Compose Configuration
# This file is for reference and local testing with production-like settings
# Actual deployment uses Azure Container Apps

version: '3.9'

services:
  # Django Backend (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_SHA: ${GIT_SHA:-}
    image: ${ACR_LOGIN_SERVER:-nucleiqacr.azurecr.io}/nucleiq-backend:${IMAGE_TAG:-latest}
    container_name: nucleiq_backend_prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
      - AZURE_STORAGE_CONTAINER_NAME=media
      - SENTRY_DSN=${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Frontend (Production - Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.nucleiq.io/api}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.nucleiq.io/ws}
    image: ${ACR_LOGIN_SERVER:-nucleiqacr.azurecr.io}/nucleiq-frontend:${IMAGE_TAG:-latest}
    container_name: nucleiq_frontend_prod
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Celery Worker (Production)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ${ACR_LOGIN_SERVER:-nucleiqacr.azurecr.io}/nucleiq-backend:${IMAGE_TAG:-latest}
    container_name: nucleiq_celery_prod
    command: celery -A config worker -l info --concurrency=2
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
    restart: unless-stopped

  # Celery Beat Scheduler (Production)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ${ACR_LOGIN_SERVER:-nucleiqacr.azurecr.io}/nucleiq-backend:${IMAGE_TAG:-latest}
    container_name: nucleiq_celery_beat_prod
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
